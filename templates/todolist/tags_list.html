{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h1>Tags</h1>
    </div>
    <div>
      <a class="btn btn-primary" href="{% url 'todolist:tag-create' %}">
        Create Tag
      </a>
    </div>
  </div>
  {% if tags %}
    <table class="table table-striped">
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
      {% for tag in tags %}
        <tr>
          <td>{{ tag.name }}</td>
          <td>
            <a href="{% url "todolist:tag-update" pk=tag.id %}" class="btn btn-secondary">Update</a>
          </td>
          <td>
            <a href="{% url "todolist:tag-delete" pk=tag.id %}" class="btn btn-secondary">Delete</a>
          </td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There is no activa tags</p>
  {% endif %}
{% endblock %}
